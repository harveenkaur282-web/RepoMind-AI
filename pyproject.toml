[project]
name = "repomind-ai"
version = "0.1.0"
description = "An Agentic Repository Intelligence Workspace for GitHub Knowledge Discovery"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Harveen Kaur" }
]

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
pythonpath = [
    "backend",
]
testpaths = [
    "backend/tests",
]
