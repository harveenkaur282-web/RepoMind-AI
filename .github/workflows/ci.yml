name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repomind
          POSTGRES_PASSWORD: repomind
          POSTGRES_DB: repomind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomind -d repomind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://repomind:repomind@localhost:5432/repomind

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=repomind psql \
            -h localhost \
            -U repomind \
            -d repomind \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
            
      - name: Run Database Migrations
        run: uv run alembic upgrade head

      - name: Run Pytest
        env:
          GITHUB_TOKEN: ${{ secrets.REPOMIND_GITHUB_TOKEN }}
        run: uv run pytest